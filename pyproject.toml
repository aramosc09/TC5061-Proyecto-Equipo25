[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "proyecto_mibici"
version = "0.0.1"
description = "Ingesta reproducible y baselines de demanda, presión de flujo y perfiles de estaciones MiBici."
authors = [
  { name = "equipo25" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "click==8.1.8",
    "loguru==0.7.3",
    "matplotlib==3.10.1",
    "mlflow==3.17.2",
    "numpy==2.2.3",
    "pandas==2.2.3",
    "pyarrow==19.0.1",
    "python-dotenv==1.0.1",
    "scikit-learn==1.6.1",
    "sqlalchemy==2.0.40",
    "tqdm==4.67.1",
    "typer==0.15.2",
]
requires-python = ">=3.13,<3.14"

[project.optional-dependencies]
notebooks = ["ipython==9.0.2", "jupyterlab==4.4.0", "seaborn==0.13.2"]
docs = ["mkdocs==1.6.1"]

[dependency-groups]
dev = ["pytest==8.3.5", "ruff==0.11.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.ruff]
line-length = 99
src = ["proyecto_mibici"]
include = ["pyproject.toml", "proyecto_mibici/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["proyecto_mibici"]
force-sort-within-sections = true
